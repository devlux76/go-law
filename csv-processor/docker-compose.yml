services:
  qdrant:
    image: qdrant/qdrant:gpu-amd-latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - /srv/qdrant:/qdrant/storage
    networks:
      - go_law

  nomic:
    image: llama-cpp-vulkan
    container_name: nomic-embed-text
    restart: unless-stopped
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
      - /dev/dri/card2:/dev/dri/card2
    ports:
      - "2002:2002"
    volumes:
      - /srv/llama.cpp:/root/.cache/llama.cpp
    networks:
      - go_law
    command: >
      --server \
      --threads-http 4 \
      --host 0.0.0.0 \
      --port 2002 \
      -hf nomic-ai/nomic-embed-text-v1.5-GGUF:F16 \
      -ngl 99 \
      -np 4 \
      --embeddings \
      -cb \
      -c 32768 \
      -b 8192 \
      -ub 8192 \
      --rope-scaling yarn \
      --rope-freq-scale .75

  csv-processor:
    build: .
    depends_on:
      - qdrant
    networks:
      - go_law
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CSV_PATH: /data/input.csv
      EMBEDDING_MODEL: "nomic-ai/nomic-embed-text-v1.5-GGUF:F16"
      BATCH_SIZE: "100"
    command: >
      --qdrant-host ${QDRANT_HOST}
      --qdrant-port ${QDRANT_PORT}
      --csv-path ${CSV_PATH}
      --embedding-model ${EMBEDDING_MODEL}
      --batch-size ${BATCH_SIZE}
    volumes:
      - ./data:/data

networks:
  csvnet:
    driver: bridge