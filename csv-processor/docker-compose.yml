version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6333:6333"
    networks:
      - csvnet

  csv-processor:
    build: .
    depends_on:
      - qdrant
    networks:
      - csvnet
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CSV_PATH: /data/input.csv
      EMBEDDING_MODEL: "default-model"
      BATCH_SIZE: "100"
    command: >
      --qdrant-host ${QDRANT_HOST}
      --qdrant-port ${QDRANT_PORT}
      --csv-path ${CSV_PATH}
      --embedding-model ${EMBEDDING_MODEL}
      --batch-size ${BATCH_SIZE}
    volumes:
      - ./data:/data

networks:
  csvnet:
    driver: bridge